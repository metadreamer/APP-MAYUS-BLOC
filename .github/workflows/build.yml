# Compila el APK en cada subida, para instalarlo sin tener que montar nada en una computadora.
# Para que salga con la firma definitiva hay que cargar cuatro secretos en el repo
# (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Sin ellos compila igual, pero con una firma de pruebas.
name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Preparar la firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/mayusbloc-release.jks
            printf 'storeFile=mayusbloc-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          fi
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      # Van después de compilar, porque la compilación genera el archivo gradlew.
      - name: Pruebas automáticas
        run: cd android && ./gradlew :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: mayus-bloc-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
